# Определяем исходную схему запроса: если впереди есть прокси (Caddy) и он
# прислал X-Forwarded-Proto — берём его; иначе схему самого запроса.
# Нужно, чтобы Django за HTTPS-прокси видел https и не зациклил редирект.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # API, админку Django и её статику проксируем на бэкенд
    # (имя сервиса в docker-compose)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Статика фронта + SPA-фолбэк: любые маршруты отдают index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
