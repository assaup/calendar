# Отдельный проект Docker, чтобы БД для разработки НЕ пересоздавала
# контейнер локального стека (docker-compose.local.yml) — раньше оба
# файла попадали в проект «calendar» и перетирали друг другу службу db.
name: planner-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    # 5433 на хосте, т.к. локальный PostgreSQL уже занимает 5432
    ports:
      - "5433:5432"
    volumes:
      - planner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  planner-pgdata:
    # имя тома закреплено, чтобы данные разработки не потерялись
    # при смене имени проекта
    name: calendar_planner-pgdata
