services:
  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    # 5433 на хосте, т.к. локальный PostgreSQL уже занимает 5432
    ports:
      - "5433:5432"
    volumes:
      - planner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  planner-pgdata:
