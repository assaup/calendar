name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # релиз: git tag v1.2.0 && git push --tags
  pull_request:

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # версия закреплена такой же, как у тебя локально (hadolint --version → 2.15.1)
      - run: >
          docker run --rm -v "$PWD:/w" -w /w hadolint/hadolint:v2.15.1
          hadolint backend/Dockerfile frontend/Dockerfile

  docker-build:
    needs: docker-lint        # не собираем образы, если Dockerfile не прошёл линтер
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # упал backend — frontend всё равно доработает
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          pull: true          # свежая база: в ней уже закрыты CVE ОС
          load: true          # без этого образ не попадёт в docker, и Trivy нечего сканировать
          tags: calendar-${{ matrix.service }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Trivy: падаем на HIGH/CRITICAL, у которых уже есть исправление
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          calendar-${{ matrix.service }}:ci

  publish:
    # в PR образы только собираются, в реестр идут main и теги v*
    if: github.event_name == 'push'
    # публикуем, только если всё остальное зелёное
    needs: [docker-build, frontend, backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # иначе GITHUB_TOKEN не сможет писать в GHCR
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/calendar-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # слои уже собраны в docker-build, тут они берутся из кэша
          # shortcut: образ собирается заново из кэша, а не берётся тот, что сканировал Trivy;
          # если база обновится между job, опубликуем непросканированный. Лучше: пушить по digest.
          cache-from: type=gha,scope=${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # тесты — на том же Postgres, что и в проде (SQLite кое-что прощает)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret
      DEBUG: "True"
      DATABASE_URL: postgres://planner:planner@localhost:5432/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check apps config
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
