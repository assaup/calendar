{{- $ctx := dict "root" $ "component" "migrate" }}
# post-install: при первой установке базы ещё нет, pre-install упал бы
# pre-upgrade: при обновлении схема меняется до того, как поедут новые поды
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    {{- include "calendar.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation  # оставляю последнюю Job, чтобы смотреть логи
    # Argo CD не отличает install от upgrade, поэтому для него порядок задаю волнами:
    # 0 — база и конфиг, 1 — миграции, 2 — бэкенд
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300  # зависшая миграция не держит выкладку вечно
  template:
    metadata:
      labels:
        {{- include "calendar.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "calendar.image" (dict "root" $ "component" "backend") }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            {{- include "calendar.backendEnvFrom" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
