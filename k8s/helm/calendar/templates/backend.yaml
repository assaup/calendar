{{- $ctx := dict "root" $ "component" "backend" }}
{{- $probeHost := .Values.backend.env.ALLOWED_HOSTS | splitList "," | first }}
apiVersion: v1
kind: Service
metadata:
  name: backend  # на это имя смотрит nginx фронта
  labels:
    {{- include "calendar.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "calendar.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "calendar.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # после миграций
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "calendar.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "calendar.labels" $ctx | nindent 8 }}
      annotations:
        # конфиг поменялся — поды перезапустятся
        checksum/config: {{ include (print $.Template.BasePath "/backend-config.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: {{ include "calendar.image" $ctx }}
          envFrom:
            {{- include "calendar.backendEnvFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          # kubelet шлёт Host = IP пода, Django его не пропустит
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
