# Значения по умолчанию — для локального k3d.
# helm upgrade --install calendar k8s/helm/calendar -n calendar --create-namespace

image:
  registry: ghcr.io/assaup
  tag: ""  # пусто — appVersion из Chart.yaml

ingress:
  className: traefik
  host: ""  # пусто — любой хост
  tlsSecret: ""
  annotations: {}

backend:
  replicas: 2  # если autoscaling выключен
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost,127.0.0.1"  # первый хост уходит в пробы
    CORS_ALLOWED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088"
    CSRF_TRUSTED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088"
    SECURE_SSL_REDIRECT: "False"
    SESSION_COOKIE_SECURE: "False"
    CSRF_COOKIE_SECURE: "False"
  # shortcut: секреты в values годятся только для локального кластера; на этапе 8 — sops
  secretKey: local-dev-not-secret
  databaseUrl: ""  # пусто — встроенный postgres
  existingSecret: ""  # готовый Secret с SECRET_KEY и DATABASE_URL — тогда свой не создаётся

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

postgres:
  enabled: true
  image: postgres:16-alpine
  user: planner
  password: planner
  database: planner
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
