# kubectl apply -f k8s/argocd/calendar-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/assaup/calendar.git
    targetRevision: devops/stage-3-k8s  # после мержа — main
    path: k8s/helm/calendar
    helm:
      releaseName: calendar
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar
  # репликами бэкенда рулит HPA — не спорю с ним
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true     # удалил из git — удалится из кластера
      selfHeal: true  # поправили руками — вернёт как в git
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true  # иначе при синке всё равно перезапишет replicas
    retry:  # упала миграция (например, база перезапускалась) — повторить тот же коммит
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
