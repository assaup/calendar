# API и админку — сразу на бэкенд, остальное — фронту
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar
  namespace: calendar
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /static  # статика админки, фронт отдаёт свою из /assets
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
