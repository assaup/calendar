# Запускать до бэкенда и дождаться:
#   kubectl wait --for=condition=complete job/migrate --timeout=180s
# shortcut: порядок держу руками; на этапе 4 будет helm hook
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: calendar
spec:
  backoffLimit: 4  # база может ещё подниматься
  ttlSecondsAfterFinished: 600  # Job нельзя изменить, а удалённую apply создаст заново
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/assaup/calendar-backend:sha-3f0ffa0
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: backend
            - secretRef:
                name: backend
