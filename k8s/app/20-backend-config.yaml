apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: calendar
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CORS_ALLOWED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088"
  # по http, без TLS
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
---
# shortcut: секреты в git, только для локального кластера; на этапе 8 — sops
apiVersion: v1
kind: Secret
metadata:
  name: backend
  namespace: calendar
type: Opaque
stringData:
  SECRET_KEY: local-dev-not-secret
  DATABASE_URL: postgres://planner:planner@db:5432/planner
