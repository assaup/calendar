apiVersion: v1
kind: Service
metadata:
  name: backend  # на это имя смотрит nginx фронта
  namespace: calendar
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: calendar
spec:
  # replicas не задаю: ими управляет HPA
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/assaup/calendar-backend:sha-3f0ffa0
          envFrom:
            - configMapRef:
                name: backend
            - secretRef:
                name: backend
          ports:
            - name: http
              containerPort: 8000
          # kubelet шлёт Host = IP пода, Django его не пропустит (ALLOWED_HOSTS)
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
