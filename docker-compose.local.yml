
name: calendar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - planner-localdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    image: calendar-backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"   # отработал и вышел — перезапускать не надо
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: "local-dev-not-secret"
      DATABASE_URL: postgres://planner:planner@db:5432/planner
    healthcheck:
      disable: true

  backend:
    build: ./backend
    image: calendar-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DEBUG: "False"
      SECRET_KEY: "local-dev-not-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgres://planner:planner@db:5432/planner
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # локально по http — secure-куки и редирект на https выключены
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 8080 занят EnterpriseDB (Apache), поэтому фронт на 3000
    ports:
      - "3000:80"
volumes:
  planner-localdata:
